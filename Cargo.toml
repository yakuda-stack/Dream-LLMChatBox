[package]
name = "dream-llmchatbox"
version = "0.1.3"
edition = "2024"
description = "Chat with local AI models (Ollama)"
license = "GPL-3.0-or-later"
repository = "https://github.com/yakuda-stack/Dream-LLMChatBox"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
dirs = "7.0.0"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
regex = "1.13.1"
similar = "2"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
ureq = { version = "3.5.2", features = ["json"] }
whisper-rs = "0.16.0"

[build-dependencies]
slint-build = "1.18.1"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
